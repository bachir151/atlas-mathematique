# Netlify configuration for L’Atelier des abstractions (static Astro site).
# Deployment itself requires an explicit authorization from the project
# director (see CLAUDE.md); this file only describes how Netlify builds it.
# Documentation: docs/DEPLOIEMENT.md

[build]
  # verify:build fails the deploy on a broken link, a draft lesson, raw TeX,
  # an unhashed inline script or a p5.js file that does not match its SRI hash.
  command = "npm run build && npm run verify:build"
  publish = "dist"

[build.environment]
  # Same version as .nvmrc; Astro 7 refuses older Node 22 releases.
  NODE_VERSION = "22.23.4"
  # Never build unvalidated lessons on Netlify, including deploy previews.
  ATELIER_DRAFTS = "0"

# frame-ancestors 'self' (not 'none'): the browser tests emulate narrow screens
# in a same-origin iframe while serving these very headers (tests/browser_p5.py).
# Directives a <meta> CSP cannot carry. The page-level policy (scripts, styles,
# connections) is generated by Astro in each HTML file: see astro.config.mjs.
# Both policies apply; the browser enforces their intersection.
[[headers]]
  for = "/*"
  [headers.values]
    Content-Security-Policy = "frame-ancestors 'self'; base-uri 'self'; object-src 'none'"
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), serial=(), bluetooth=()"
    Cross-Origin-Opener-Policy = "same-origin"

# Fingerprinted build assets never change at a given URL.
[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# The p5.js path contains its exact version (src/experiences/p5/runtime.ts).
[[headers]]
  for = "/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
